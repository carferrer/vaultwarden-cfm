name: Actualizar CHANGELOG automáticamente

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      motivo:
        description: 'Ejecución manual'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar versión y rama
        id: vars
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="manual-${{ github.run_number }}"
          fi

          BRANCH="changelog/${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Actualizar archivo CHANGELOG.md
        shell: bash
        run: |
          FECHA=$(date +%Y-%m-%d)
          touch CHANGELOG.md
          cat CHANGELOG.md > old_changelog.txt

          echo -e "# Versión ${{ steps.vars.outputs.version }} ($FECHA)\n" > CHANGELOG.md
          echo -e "${{ github.event.release.body }}\n" >> CHANGELOG.md
          cat old_changelog.txt >> CHANGELOG.md

          rm old_changelog.txt

      - name: Crear rama y subir cambios
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${{ steps.vars.outputs.branch }}"
          git add CHANGELOG.md
          git commit -m "chore: actualizar CHANGELOG.md para la versión ${{ steps.vars.outputs.version }} [skip ci]"
          git push origin "${{ steps.vars.outputs.branch }}"

      - name: Crear pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.vars.outputs.branch }}" \
            --title "chore: actualizar CHANGELOG para ${{ steps.vars.outputs.version }}" \
            --body "Actualización automática del CHANGELOG tras publicar la release ${{ steps.vars.outputs.version }}."
