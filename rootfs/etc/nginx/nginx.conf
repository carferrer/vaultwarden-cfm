# Ejecutar Nginx en primer plano.
daemon off;

# Esta configuración se ejecuta dentro de Docker.
user root;

# Ubicación del identificador del proceso.
pid /var/run/nginx.pid;

# Definir el número de procesos de trabajo.
worker_processes 1;

# Activar la compilación JIT de expresiones regulares para mejorar el rendimiento.
pcre_jit on;

# Enviar los errores al registro del complemento.
error_log /proc/1/fd/1 error;

# Cargar los módulos dinámicos.
include /etc/nginx/modules/*.conf;

# Número máximo de conexiones simultáneas por proceso de trabajo.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/includes/mime.types;

    access_log              off;
    client_max_body_size    4G;
    default_type            application/octet-stream;
    gzip                    on;
    keepalive_timeout       65;
    sendfile                on;
    server_tokens           off;
    tcp_nodelay             on;
    tcp_nopush              on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/includes/upstream.conf;
    include /etc/nginx/includes/fail2ban-map.conf;

    include /etc/nginx/servers/*.conf;
}
