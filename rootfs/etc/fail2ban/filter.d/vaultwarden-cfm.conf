# Match only the actual identity logger prefix, never text inside a username.
# The timestamp format is fixed by the Vaultwarden service when enabled.
[Definition]
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S(?:\.%%f)?\]
failregex = ^\[vaultwarden::api::identity\]\[ERROR\] Username or password is incorrect\. Try again\. IP: <ADDR>\. Username:.*$
ignoreregex =
