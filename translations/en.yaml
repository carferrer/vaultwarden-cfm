---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the app provides.
  ssl:
    name: SSL
    description: >-
      Enables/Disables SSL (HTTPS) on the web interface.
  certfile:
    name: Certificate file
    description: >-
      The certificate file to use for SSL. Note that this file must
      exist in the /ssl/ folder.
  keyfile:
    name: Private key file
    description: >-
      The private key file to use for SSL. Note that this file must
      exist in the /ssl/ folder.
  admin_restriction_enabled:
    name: Restrict admin access by network
    description: >-
      Allow /admin only from the configured networks. Disabled by default.
      Restart the app after changing this option.
  admin_allowed_networks:
    name: Allowed admin networks
    description: >-
      List of IPv4/IPv6 addresses or CIDR networks, e.g. 192.168.2.0/23.
      When restriction is enabled, an empty list denies all admin access.
      Uses the actual connection source, not forwarding headers.
  request_size_limit:
    name: Size limit of HTTP requests
    description: >-
      Optionally set the size limit of HTTP requests on the API of
      Vaultwarden. This might be needed to support larger imports.
      The default is 10485760, which is 10MB.
network:
  7277/tcp: Web interface
