---
name: Vaultwarden
version: 2026.11.04
slug: bitwarden-cfm
description: Open source gestor contraseñas
url: https://github.com/carferrer/vaultwarden-cfm
image: "ghcr.io/carferrer/vaultwarden-cfm"
image_tag: "latest"
webui: "[PROTO:ssl]://[HOST]:[PORT:7277]"
init: false
arch:
  - aarch64
  - amd64
ports:
  7277/tcp: 7277
ports_description:
  7277/tcp: Vaultwarden Web interface
map:
  - ssl
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  admin_restriction_enabled: false
  admin_allowed_networks:
    - 192.168.2.0/23
  fail2ban_enabled: false
  fail2ban_maxretry: 10
  fail2ban_findtime: 600
  fail2ban_bantime: -1
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  request_size_limit: int?
  admin_restriction_enabled: bool
  admin_allowed_networks:
    - str
  fail2ban_enabled: bool
  fail2ban_maxretry: int
  fail2ban_findtime: int
  fail2ban_bantime: int
