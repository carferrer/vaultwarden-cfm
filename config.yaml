---
name: Vaultwarden
version: 2026.08.06
slug: bitwarden-cfm
description: Open source gestor contraseñas
url: https://github.com/carferrer/vaultwarden-cfm
image: "ghcr.io/carferrer/vaultwarden-cfm"
image_tag: "latest"
webui: "[PROTO:ssl]://[HOST]:[PORT:7277]"
init: false
arch:
  - aarch64
  - amd64
ports:
  7277/tcp: 7277
ports_description:
  7277/tcp: Vaultwarden Web interface
map:
  - ssl
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
  request_size_limit: int?
